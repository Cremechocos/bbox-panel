# Publie une version : git tag v3.1.0 && git push --tags
# → archive bbox-panel.tar.gz (interface déjà construite, utilisée par install.sh) + image Docker multi-architecture
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Interface
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Archive
        run: |
          mkdir -p out/bbox-panel/web
          cp -R server package.json install.sh README.md out/bbox-panel/
          cp -R web/dist out/bbox-panel/web/dist
          tar -czf bbox-panel.tar.gz -C out bbox-panel
          tar -tzf bbox-panel.tar.gz | head -20
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" bbox-panel.tar.gz --clobber
          else
            gh release create "$TAG" bbox-panel.tar.gz --title "Ma Bbox $TAG" --generate-notes
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
